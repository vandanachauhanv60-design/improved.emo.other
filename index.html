 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Desk Emo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      touch-action: manipulation;
    }
    #face-canvas {
      width: 320px;
      height: 240px;
      margin-top: auto;
      margin-bottom: 20px;
    }
    .bottom-panel {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    #status {
      font-size: 14px;
      color: #888ea8;
      min-height: 40px;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      background: #161622;
      border: 1px solid #2a2a3c;
      color: #00e5ff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    button:active { background: #00e5ff; color: #000; }
    #video { display: none; }
  </style>
</head>
<body>

  <canvas id="face-canvas" width="320" height="240"></canvas>
  <video id="video" playsinline autoplay muted></video>

  <div class="bottom-panel">
    <div id="status">Tap "Start Companion" to wake Emo up.</div>
    <div class="btn-row">
      <button id="start-btn">Start Companion</button>
      <button id="scare-btn">🔫 Scare</button>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const GEMINI_API_KEY = "AQ.Ab8RN6JE2v8jz8OvIRqkhfYEZN234o8co2DXpdObt76Ej7peEA";
    const USER_NAME = "Agam";

    const canvas = document.getElementById("face-canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("start-btn");
    const scareBtn = document.getElementById("scare-btn");
    const video = document.getElementById("video");

    let currentMood = "happy";
    let isSpeaking = false;
    let animPulse = 0;
    let pulseDir = 1;

    // --- PROCEDURAL FACE RENDERER ---
    function drawFace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#00e5ff";
      ctx.fillStyle = "#00e5ff";

      animPulse += 0.05 * pulseDir;
      if (animPulse > 1 || animPulse < 0) pulseDir *= -1;

      const r = 38 + animPulse * 2;
      const left = { x: canvas.width / 2 - 58, y: canvas.height / 2 };
      const right = { x: canvas.width / 2 + 58, y: canvas.height / 2 };

      if (currentMood === "happy") {
        ctx.beginPath();
        ctx.arc(left.x, left.y, r, Math.PI, 0, false);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(right.x, right.y, r, Math.PI, 0, false);
        ctx.stroke();
      } else if (currentMood === "scared") {
        const j = (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.arc(left.x + j, left.y + j, r * 0.45, 0, Math.PI * 2);
        ctx.arc(right.x - j, right.y + j, r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      } else if (currentMood === "bored" || currentMood === "sleepy") {
        ctx.fillRect(left.x - 30, left.y - 6, 60, 12);
        ctx.fillRect(right.x - 30, right.y - 6, 60, 12);
      } else if (currentMood === "thinking") {
        ctx.beginPath();
        ctx.arc(left.x, left.y - 12, r * 0.85, 0, Math.PI * 2);
        ctx.arc(right.x, right.y - 12, r * 0.85, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Neutral / Glowing default
        ctx.beginPath();
        ctx.arc(left.x, left.y, r, 0, Math.PI * 2);
        ctx.arc(right.x, right.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawFace);
    }
    drawFace();

    // --- SPEECH OUTPUT (TTS) ---
    function speak(text) {
      if (!window.speechSynthesis) return;
      isSpeaking = true;
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.35;
      utterance.rate = 1.0;
      utterance.onend = () => {
        isSpeaking = false;
        listen();
      };
      statusEl.textContent = text;
      speechSynthesis.speak(utterance);
    }

    // --- GEMINI API CALL ---
    async function askGemini(prompt) {
      currentMood = "thinking";
      statusEl.textContent = "Thinking...";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `You are Desk Emo, a witty, robotic desktop pet companion for ${USER_NAME}. Keep answers under 2 short sentences. User said: ${prompt}` }] }]
          })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "I drew a blank.";
        currentMood = "happy";
        speak(reply);
      } catch (err) {
        currentMood = "bored";
        speak("Could not reach Gemini.");
      }
    }

    // --- SPEECH RECOGNITION (STT) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    function initSpeech() {
      if (!SpeechRecognition) {
        statusEl.textContent = "Speech recognition not supported in this browser. Use Chrome.";
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        askGemini(transcript);
      };

      recognition.onend = () => {
        if (!isSpeaking) listen();
      };
    }

    function listen() {
      if (isSpeaking) return;
      try { recognition.start(); } catch (_) {}
    }

    // --- CAMERA & PRESENCE ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
      } catch (e) {
        console.log("Camera access ignored or unavailable");
      }
    }

    // --- CONTROLS ---
    startBtn.onclick = async () => {
      startBtn.style.display = "none";
      initSpeech();
      await initCamera();
      speak(`Hey ${USER_NAME}! Desk Emo is online.`);
    };

    scareBtn.onclick = () => {
      currentMood = "scared";
      speak("Don't shoot! I'm just a cute bot!");
    };
  </script>
</body>
</html>
